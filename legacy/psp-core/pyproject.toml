[project]
name = "psp-core"
version = "0.1.0"
description = "Library with core functions for power system protection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.2",
    "shapely>=2.1.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"