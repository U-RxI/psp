[project]
name = "psp"
version = "0.2.0"
description = "Python library for power system protection."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "comtrade>=0.1.2",
    "matplotlib>=3.10.6",
    "numpy>=2.3.4",
    "scipy>=1.16.1",
    "shapely>=2.1.1",
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipykernel>=6.30.0",
    "jupyterlab>=4.4.0",
    "jupytext>=1.17.0",
    "nbmake>=1.5.5",
    "pytest>=8.4.2",
    "ruff>=0.14.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
